name: firmware

on:
  push:
  pull_request:

jobs:
  protocol:
    name: protocol + core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
      - name: Contract and source tests
        run: make -C firmware test

  build:
    name: all board profiles
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - name: Install avr-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc cmake ninja-build python3
      - name: All board profiles
        run: make -C firmware all-boards
      - uses: actions/upload-artifact@v4
        with:
          name: usbasp-hex
          path: |
            firmware/build/usbasp-atmega8-clone/usbasp.hex
            firmware/build/usbasp-atmega8-usbisp/usbasp.hex
            firmware/build/usbasp-atmega88/usbasp.hex
            firmware/build/usbasp-hiduart-atmega8/usbasp-hiduart.hex
            firmware/build/usbasp-hiduart-atmega8/usbasp-hiduart.eep
            firmware/build/usbasp-hiduart-atmega88/usbasp-hiduart.hex
            firmware/build/usbasp-hiduart-atmega88/usbasp-hiduart.eep
