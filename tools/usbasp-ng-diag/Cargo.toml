[package]
name = "usbasp-ng-diag"
version = "0.3.0"
edition = "2021"
description = "USBasp NG Diagnostics Plane host tool (USBASP-NG DIAG v1)"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
# Vendored libusb → release binary needs no system libusb-1.0.
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
